---
"on":
  push:
    paths-ignore:
      - "**.md"
      - docs/*
  pull_request:
    paths-ignore:
      - "**.md"
      - docs/*
  workflow_dispatch:

# https://github.com/softprops/action-gh-release/issues/236
permissions:
  contents: write

env:
  python-version: 3.x
  cache: pip

jobs:
  # test:
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       runs-on:
  #         - ubuntu-latest
  #         - macos-latest
  #         - windows-latest
  #   runs-on: ${{ matrix.runs-on }}
  #   steps:
  #     - uses: actions/checkout@v7
  #     - uses: actions/setup-python@v7
  #       with:
  #         python-version: ${{ env.python-version }}
  #         cache: ${{ env.cache }}
  #         cache-dependency-path: |-
  #           requirements.txt
  #           requirements/dev.txt
  #     - name: Install dependencies
  #       run: |
  #         pip install -e '.[dev]'
  #     - name: Test
  #       run: |
  #         pre-commit run -a
  build:
    # needs: test
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.python-version }}
          cache: ${{ env.cache }}
          cache-dependency-path: |-
            requirements.txt
            requirements/dev.txt
      - name: Verify release metadata
        run: python tools/release.py
      - name: Verify tag and prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: python tools/release.py --tag "$GITHUB_REF_NAME"
      - name: Install dependencies
        run: |
          pip install build
      - name: Build
        run: |
          python -m build
          python tools/release.py --dist dist
      - name: Build the versioned multilingual manual before publishing
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        env:
          READTHEDOCS_VERSION: ${{ github.ref_name }}
        run: |
          python -m pip install -r docs/requirements.txt
          python tools/build_translations.py --output docs/_build/multilingual
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: python-distributions
          path: dist/*
  release-regression:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/regression-tests.yml
    permissions:
      contents: read
  publish:
    needs: [build, release-regression]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: python-distributions
          path: dist
      - run: python tools/release.py --tag "$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v3
        with:
          body_path: build/CHANGELOG.md
          files: |
            dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: Freed-Wu/update-aur-package@v1.0.11
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          package_name: python-mulimgviewer
          ssh_private_key: ${{secrets.AUR_SSH_PRIVATE_KEY}}
