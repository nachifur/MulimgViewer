# https://docs.readthedocs.io/en/stable/config-file/v2.html
---
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3"
  jobs:
    post_install:
      # docs/conf.py needs package metadata but no GUI dependencies.
      - python -m pip install --no-deps .

sphinx:
  configuration: docs/conf.py

# formats:
#   - pdf
#
python:
  install:
    - requirements: docs/requirements.txt
