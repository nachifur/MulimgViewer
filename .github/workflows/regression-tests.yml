---
name: Functional regression report

'on':
  pull_request:
  push:
    branches: [master, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            auto_test_scripts/requirements.txt
      - name: Install dependencies and FFmpeg
        shell: pwsh
        run: |
          python -m pip install -r auto_test_scripts/requirements.txt
          choco install ffmpeg -y --no-progress
      - name: Run all functional regressions
        run: python auto_test_scripts/run_tests.py --strict-skips
      - name: Add test summary to this run
        if: always()
        shell: pwsh
        run: |
          $reportRoot = 'auto_test_scripts/reports'
          $latestPath = Join-Path $reportRoot 'latest.json'
          if (Test-Path $latestPath) {
            $latest = Get-Content $latestPath -Raw | ConvertFrom-Json
            $reportPath = Join-Path $reportRoot $latest.directory
            $summary = Join-Path $reportPath 'summary.md'
            Get-Content $summary |
              Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
      - name: Upload test reports and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: regression-report-windows-${{ github.sha }}
          path: |
            auto_test_scripts/reports/**/*.html
            auto_test_scripts/reports/**/*.json
            auto_test_scripts/reports/**/*.xml
            auto_test_scripts/reports/**/*.md
            auto_test_scripts/reports/**/*.log
          if-no-files-found: warn
          retention-days: 14
