# https://docs.readthedocs.io/en/stable/config-file/v2.html
---
version: 2

build:
  os: ubuntu-22.04
  jobs:
    post_checkout:
      - |
        if [ "$READTHEDOCS_PROJECT" = "mulimgviewer-en" ]; then exit 183; fi
    post_build:
      - python tools/build_translations.py
  tools:
    python: "3"

sphinx:
  configuration: docs/conf.py

# formats:
#   - pdf
#
python:
  install:
    - requirements: docs/requirements.txt
